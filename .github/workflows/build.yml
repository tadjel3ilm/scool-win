name: Build All 3 Windows Apps
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Nativefier
        run: npm install -g nativefier
      - name: Build App 1 (التسجيل)
        run: nativefier --disable-gpu --name "Registration" --platform windows --arch x64 --electron-version 22.3.27 "file:///C:/Users/%D8%B5/Desktop/New%20folder/%D8%A7%D9%84%D8%AA%D8%B3%D8%AC%D9%8A%D9%84%D8%8C%20%D8%A7%D9%84%D8%BA%D9%8A%D8%A7%D8%A8%D8%A7%D8%AA%20%D9%88%D8%A7%D9%84%D8%A5%D8%B9%D9%84%D8%A7%D9%86%D8%A7%D8%AA%20-%20%D9%85%D8%AF%D8%B1%D8%B3%D8%A9%20%D8%A7%D9%84%D8%AF%D8%B9%D9%85.html"
      - name: Build App 2 (السجل)
        run: nativefier --disable-gpu --name "Archive" --platform windows --arch x64 --electron-version 22.3.27 file:///C:/Users/%D8%B5/Desktop/New%20folder/%D8%B3%D8%AC%D9%84%20%D8%A7%D9%84%D8%AA%D9%84%D8%A7%D9%85%D9%8A%D8%B0%20%D9%88%D8%A7%D9%84%D8%BA%D9%8A%D8%A7%D8%A8%D8%A7%D8%AA%20-%20%D9%85%D8%AF%D8%B1%D8%B3%D8%A9%20%D8%A7%D9%84%D8%AF%D8%B9%D9%85.html""
      - name: Build App 3 (الخزينة)
        run: nativefier --disable-gpu --name "Treasury" --platform windows --arch x64 --electron-version 22.3.27 "file:///C:/Users/%D8%B5/Desktop/New%20folder/%D8%A7%D9%84%D8%AE%D8%B2%D9%8A%D9%86%D8%A9%20%D9%88%D8%B7%D8%A8%D8%A7%D8%B9%D8%A9%20%D8%A7%D9%84%D9%88%D8%B5%D9%88%D9%84%D8%A7%D8%AA%20-%20%D9%85%D8%AF%D8%B1%D8%B3%D8%A9%20%D8%A7%D9%84%D8%AF%D8%B9%D9%85.html"
      - name: Upload All Apps
        uses: actions/upload-artifact@v4
        with:
          name: School-Desktop-Apps
          path: |
            Registration-win32-x64/
            Archive-win32-x64/
            Treasury-win32-x64/
